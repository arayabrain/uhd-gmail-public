config_name: config_color
saved_data_root: data/weights

seed: 2
n_splits: 10
decode_from: eeg

# ==== preproc ==== #
dura_unit: 1.25 # sec
no_avg: false  # default: false
n_trial_avg: 5
n_ch_eeg: 128
n_ch_noise: 3
unit_coeff: 1.0e-6
preamp_gain : 10
jitter: 0.1 # sec, max width when random; fixed offset when fixed
jitter_mode: random # random | fixed
nlms:
  mu: 0.1
  w: random
bandpass:
  low: 2.
  high: 118.
car: true  # common average reference
notch_filter: true
bandpass_filter:
  lower_band: 2
  upper_band: 118
emg_highpass:
  apply: false
  low: 60
  high: 127
wo_adapt_filt: false # default: false

# ==== Architecture ==== #
model_name: EEGNet
num_channels: 128
n_class: 5
k1: 30
k2: 4
F1: 16
F2: 32
D: 2
p1: 2
p2: 4
dr1: 0.50
dr2: 0.75
hilbert_transform: False
channels_use:
  - 4
  - 17
  - 39
  - 49
  - 60
  - 67
  - 78
  - 92
  - 104
  - 117
rnn_type: LSTM
hidden_size: 128
num_layers: 2
bidirectional: True
dropout_rate: 0.5
last_activation: softmax
C: 1.6653738245684553

cBraMod:
  num_channels: ${num_channels}
  in_dim: 200
  out_dim: 200
  d_model: 200
  dim_feedforward: 800
  seq_len: 30
  n_layer: 12
  nhead: 8
  patch_mode: overlap
  hopsize: 50
  classifier: all_patch_reps
  dropout: ${dr2}
  num_of_classes: ${n_class}
  use_backbone_weights: true
  backbone_weight_path: data/weights/cBraMod/pretrained_weights.pth
  encoder_lr: ${learning_rate}
  decoder_lr: ${learning_rate}

# ==== Training ==== #
save_results: True
test_ratio: 0.1
record_history_filepath: outputs/offline/baseline/history_color_rotating_test_fold_cv.csv
test_record_history_filepath: outputs/offline/baseline/history_color_rotating_test_fold_test.csv
normalize: false
n_epochs: 1000
optimizer: AdamW
learning_rate: 1.0e-4
eps: 1.0e-8
weight_decay: 0.01
scheduler:
  apply: False
  name: CosineAnnealingLR
  factor: 0.1
  patience: 10
  Tmax: 100
batch_size: 16
n_worekers: 0
save_best:
  apply: True
  monitor: loss_val
log_inference: True
ensemble_methods:
  - mean
  - max
  - zscore_mean
  - zscore_max
  - entropy_weighted
  - inverse_entropy_weighted
  - majority

# Runs are addressed by BIDS entities (sub-N, task, acq). Paths point at
# derived arrays from bids/extract_from_bids.py under output_root.
parallel_sets: sub-1_task-minimallyovert_acq-calibration
sub-1_task-minimallyovert_acq-calibration:
  subject: sub-1
  session: ses-20230511
  task: minimallyovert
  acq: calibration
  csv_dir: data/derived/sub-1/ses-20230511
  npy_dir: data/derived/sub-1/ses-20230511/task-minimallyovert_acq-calibration_run-01
  gpu: 0
sub-1_task-overt_acq-calibration:
  subject: sub-1
